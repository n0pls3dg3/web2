<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - {{ brand_name }}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-stone-100 min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    
    <div class="max-w-md w-full space-y-8 glass-panel p-8 rounded-3xl shadow-2xl">
        <div>
            <div class="flex justify-center">
                <a href="{{ url_for('index') }}">
                    <img class="h-16 w-auto object-contain rounded" src="/{{ get_logo_path() }}" alt="{{ brand_name }}">
                </a>
            </div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-stone-900 font-heading">
                Tạo tài khoản mới
            </h2>
            <p class="mt-2 text-center text-sm text-stone-600">
                Hoặc
                <a href="{{ url_for('login') }}" class="font-medium text-amber-700 hover:text-amber-800 transition-colors">
                    đăng nhập tài khoản đã có
                </a>
            </p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="space-y-2">
                    {% for category, msg in messages %}
                        <div class="{% if category == 'success' %}bg-green-50 border-l-4 border-green-500 text-green-700{% else %}bg-red-50 border-l-4 border-red-500 text-red-700{% endif %} p-4 rounded-r flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <i class="fa-solid {% if category == 'success' %}fa-circle-check text-green-500{% else %}fa-circle-xmark text-red-500{% endif %}"></i>
                                <p class="text-sm font-medium">{{ msg }}</p>
                            </div>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form class="mt-8 space-y-6" action="{{ url_for('register') }}" method="POST">
            <div class="rounded-md space-y-4">
                <div>
                    <label for="fullname" class="block text-sm font-medium text-stone-700">Họ và tên *</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-regular fa-user text-stone-400"></i>
                        </div>
                        <input type="text" name="fullname" id="fullname" required
                            class="block w-full pl-10 pr-3 py-2.5 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent text-stone-900 bg-stone-50"
                            placeholder="Nguyễn Văn A" value="">
                    </div>
                </div>

                <div>
                    <label for="phone" class="block text-sm font-medium text-stone-700">Số điện thoại *</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-phone text-stone-400"></i>
                        </div>
                        <input type="text" name="phone" id="phone" required
                            class="block w-full pl-10 pr-3 py-2.5 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent text-stone-900 bg-stone-50"
                            placeholder="09xxxxxxx" value="">
                    </div>
                </div>

                <div>
                    <label for="username" class="block text-sm font-medium text-stone-700">Tên đăng nhập *</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-regular fa-envelope text-stone-400"></i>
                        </div>
                        <input type="text" name="username" id="username" required
                            class="block w-full pl-10 pr-3 py-2.5 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent text-stone-900 bg-stone-50"
                            placeholder="TenDangNhap" value="">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-stone-700">Mật khẩu *</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock text-stone-400"></i>
                        </div>
                        <input type="password" name="password" id="password" required
                            class="block w-full pl-10 pr-3 py-2.5 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent text-stone-900 bg-stone-50"
                            placeholder="••••••">
                    </div>
                </div>

                <div>
                    <label for="confirm_password" class="block text-sm font-medium text-stone-700">Xác nhận mật khẩu *</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-circle-check text-stone-400"></i>
                        </div>
                        <input type="password" name="confirm_password" id="confirm_password" required
                            class="block w-full pl-10 pr-3 py-2.5 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent text-stone-900 bg-stone-50"
                            placeholder="••••••">
                    </div>
                </div>
            </div>

            <div>
                <button type="submit"
                    class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-amber-700 hover:bg-amber-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-500 transition-all font-heading font-semibold shadow-md">
                    Đăng Ký Tài Khoản
                </button>
            </div>
        </form>
    </div>

</body>
</html>
